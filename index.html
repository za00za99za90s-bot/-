<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار التوظيف – تمريض</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#f4f7f9;
  color:#1d2939;
}

header{
  background:#0070d7;
  color:white;
  padding:18px 15px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.container{
  max-width:850px;
  margin:30px auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:14px;
  padding:25px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

h1{
  text-align:center;
  color:#0070d7;
  font-size:27px;
  margin-top:5px;
}

label{
  display:block;
  margin-top:18px;
  margin-bottom:7px;
  font-weight:bold;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ccd5df;
  border-radius:8px;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#0070d7;
}

button{
  width:100%;
  padding:15px;
  margin-top:22px;
  border:0;
  border-radius:9px;
  background:#0070d7;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#005cad;
}

.hidden{
  display:none;
}

.exam-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
}

.question-number{
  font-weight:bold;
  color:#0070d7;
}

.timer{
  background:#fff3cd;
  color:#856404;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
  min-width:100px;
  text-align:center;
}

.timer.danger{
  background:#f8d7da;
  color:#842029;
}

.question{
  font-size:20px;
  font-weight:bold;
  line-height:1.6;
  margin-bottom:20px;
  direction:ltr;
  text-align:left;
}

.option{
  direction:ltr;
  text-align:left;
  border:1px solid #d5dce3;
  padding:14px;
  margin:10px 0;
  border-radius:9px;
  cursor:pointer;
  transition:.2s;
}

.option:hover{
  background:#eef6ff;
  border-color:#0070d7;
}

.option.selected{
  background:#dceeff;
  border-color:#0070d7;
}

.progress{
  height:8px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:20px;
}

.progress-bar{
  height:100%;
  background:#0070d7;
  width:0%;
  transition:.3s;
}

.result{
  text-align:center;
}

.score{
  font-size:42px;
  font-weight:bold;
  color:#0070d7;
  margin:20px;
}

.warning{
  background:#fff3cd;
  color:#664d03;
  padding:12px;
  border-radius:8px;
  margin-top:15px;
  line-height:1.6;
}

.error{
  color:#b42318;
  margin-top:12px;
  text-align:center;
}

@media(max-width:600px){
  header{
    font-size:18px;
  }

  .card{
    padding:18px;
  }

  h1{
    font-size:23px;
  }

  .question{
    font-size:18px;
  }

  .exam-top{
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<header>
  منظمة الإنقاذ الدولية
</header>

<div class="container">

  <!-- صفحة البداية -->
  <div id="startPage" class="card">

    <h1>اختبار التوظيف – تمريض</h1>

    <label for="candidateName">اسم الممتحن/الممتحنة</label>
    <input
      type="text"
      id="candidateName"
      placeholder="اكتب الاسم الكامل"
      autocomplete="name"
    >

    <label for="candidateEmail">البريد الإلكتروني</label>
    <input
      type="email"
      id="candidateEmail"
      placeholder="example@email.com"
      autocomplete="email"
    >

    <button onclick="startExam()">
      بدء الاختبار
    </button>

    <div id="startError" class="error"></div>

    <div class="warning">
      الاختبار يتكون من 100 سؤال. لكل سؤال 40 ثانية.
      عند انتهاء الوقت سيتم الانتقال تلقائيًا إلى السؤال التالي.
    </div>

  </div>


  <!-- صفحة الاختبار -->
  <div id="examPage" class="card hidden">

    <div class="exam-top">

      <div class="question-number" id="questionNumber">
        السؤال 1 من 100
      </div>

      <div class="timer" id="timer">
        40 ثانية
      </div>

    </div>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div id="questionText" class="question"></div>

    <div id="options"></div>

    <button onclick="nextQuestion()" id="nextButton">
      التالي
    </button>

  </div>


  <!-- النتيجة -->
  <div id="resultPage" class="card hidden">

    <div class="result">

      <h1>انتهى الاختبار</h1>

      <p id="candidateResult"></p>

      <div class="score" id="score"></div>

      <p id="resultDetails"></p>

    </div>

  </div>

</div>

/* =========================================================
   المتغيرات
========================================================= */

let currentQuestion = 0;
let score = 0;
let selectedAnswer = null;
let timerInterval = null;
let timeLeft = 40;
let candidateName = "";
let candidateEmail = "";


/* =========================================================
   بدء الاختبار
========================================================= */

function startExam(){

  const nameInput =
    document.getElementById("candidateName").value.trim();

  const emailInput =
    document.getElementById("candidateEmail").value.trim().toLowerCase();

  const error =
    document.getElementById("startError");

  error.textContent = "";

  if(!nameInput){
    error.textContent = "يرجى إدخال اسم الممتحن/الممتحنة.";
    return;
  }

  if(!emailInput){
    error.textContent = "يرجى إدخال البريد الإلكتروني.";
    return;
  }

  if(!isValidEmail(emailInput)){
    error.textContent = "يرجى إدخال بريد إلكتروني صحيح.";
    return;
  }

  /*
    منع إعادة الاختبار على نفس المتصفح
  */

  const usedKey =
    "nursing_exam_used_" + emailInput;

  if(localStorage.getItem(usedKey) === "true"){

    error.textContent =
      "هذا البريد الإلكتروني استخدم الاختبار مسبقًا ولا يمكن بدء محاولة جديدة.";

    return;
  }

  candidateName = nameInput;
  candidateEmail = emailInput;

  /*
    تسجيل المحاولة مباشرة عند بدء الاختبار
  */

  localStorage.setItem(usedKey,"true");

  document.getElementById("startPage")
    .classList.add("hidden");

  document.getElementById("examPage")
    .classList.remove("hidden");

  currentQuestion = 0;
  score = 0;

  showQuestion();
}


/* =========================================================
   التحقق من البريد
========================================================= */

function isValidEmail(email){

  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

}


/* =========================================================
   عرض السؤال
========================================================= */

function showQuestion(){

  clearInterval(timerInterval);

  selectedAnswer = null;

  const q = questions[currentQuestion];

  document.getElementById("questionNumber").textContent =
    "السؤال " + (currentQuestion + 1) +
    " من " + questions.length;

  document.getElementById("questionText").textContent =
    q.q;

  const optionsContainer =
    document.getElementById("options");

  optionsContainer.innerHTML = "";

  const letters = ["A","B","C","D"];

  q.options.forEach((option,index)=>{

    const div = document.createElement("div");

    div.className = "option";

    div.innerHTML =
      "<strong>" + letters[index] + ".</strong> " +
      escapeHtml(option);

    div.onclick = function(){

      document
        .querySelectorAll(".option")
        .forEach(el =>
          el.classList.remove("selected")
        );

      div.classList.add("selected");

      selectedAnswer = letters[index];

    };

    optionsContainer.appendChild(div);

  });

  const progress =
    ((currentQuestion) / questions.length) * 100;

  document.getElementById("progressBar")
    .style.width = progress + "%";

  document.getElementById("nextButton").textContent =
    currentQuestion === questions.length - 1
      ? "إنهاء الاختبار"
      : "التالي";

  startTimer();

}


/* =========================================================
   المؤقت
========================================================= */

function startTimer(){

  timeLeft = 40;

  updateTimer();

  timerInterval = setInterval(()=>{

    timeLeft--;

    updateTimer();

    if(timeLeft <= 0){

      clearInterval(timerInterval);

      nextQuestion();

    }

  },1000);

}


function updateTimer(){

  const timer =
    document.getElementById("timer");

  timer.textContent =
    timeLeft + " ثانية";

  if(timeLeft <= 10){

    timer.classList.add("danger");

  }else{

    timer.classList.remove("danger");

  }

}


/* =========================================================
   السؤال التالي
========================================================= */

function nextQuestion(){

  clearInterval(timerInterval);

  /*
    احتساب الإجابة
  */

  if(selectedAnswer === questions[currentQuestion].answer){

    score++;

  }

  currentQuestion++;

  if(currentQuestion >= questions.length){

    finishExam();

    return;

  }

  showQuestion();

}


/* =========================================================
   إنهاء الاختبار
========================================================= */

function finishExam(){

  clearInterval(timerInterval);

  document.getElementById("examPage")
    .classList.add("hidden");

  document.getElementById("resultPage")
    .classList.remove("hidden");

  const percentage =
    Math.round((score / questions.length) * 100);

  document.getElementById("candidateResult").textContent =
    "الممتحن/الممتحنة: " + candidateName;

  document.getElementById("score").textContent =
    score + " / " + questions.length;

  document.getElementById("resultDetails").innerHTML =
    "النسبة: <strong>" + percentage + "%</strong><br><br>" +
    "تم تسجيل نتيجة الاختبار.";
}


/* =========================================================
   حماية عرض النصوص
========================================================= */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
